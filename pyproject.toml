[project]
name = "industrial-hackathon"
version = "0.1.0"
description = "Industrial Hackathon"
readme = "README.md"
authors = [
    { name = "Arjit", email = "42977377+arjityadav@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "opencv-python-headless>=4.10",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=5.0",
    "torch>=2.5",
    "umap-learn>=0.5.7",
    "uvicorn>=0.54.0",
]

# On Linux servers (no GPU) take PyTorch from its CPU-only index: the PyPI build pulls several GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
